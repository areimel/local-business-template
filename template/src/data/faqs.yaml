  - name: "Air Conditioning"
    slug: "air-conditioning"
    questions:
      - question: "How do I know if I need AC repair or replacement?"
        answer: "Several signs indicate it may be time for a repair or replacement: your system is more than 10-15 years old, energy bills are rising without a clear cause, you're facing frequent or increasingly expensive repairs, the system uses R-22 refrigerant (which has been phased out), or your home has uneven temperatures and humidity issues. Our technicians will give you an honest assessment — we never push a replacement when a repair will do the job."
      - question: "How often should I service my AC?"
        answer: "In our region's demanding climate, we recommend professional AC maintenance at least twice a year — once before the cooling season begins in spring and once before heating season in fall. Our maintenance program makes this easy with scheduled tune-ups that keep your system efficient, reduce energy bills, and help prevent unexpected breakdowns during the hottest months."
      - question: "What brands do you install and service?"
        answer: "Your Company Name installs and services all major HVAC brands. With over 35 years of experience, our technicians are trained and equipped to work on virtually any residential or light commercial system. When it's time for a new installation, we'll help you choose the best brand and model for your home's size, layout, and budget."
      - question: "Why is my AC running but not cooling?"
        answer: "An AC that runs without cooling could be caused by several issues: a dirty or clogged air filter restricting airflow, low refrigerant due to a leak, a frozen evaporator coil, a failing compressor, or a malfunctioning thermostat. Start by checking and replacing your air filter — this is the most common and easiest fix. If that doesn't resolve it, call Your Company Name for a professional diagnosis. Running a system that isn't cooling properly can cause further damage."
      - question: "How do I choose the right size AC for my home?"
        answer: "Choosing the right AC size requires a professional load calculation that considers your home's square footage, insulation levels, window placement, ductwork, ceiling height, and our region's specific climate conditions. An undersized unit will run constantly without adequately cooling, while an oversized unit will short-cycle, waste energy, and fail to properly dehumidify. Our technicians perform Manual J load calculations to ensure your new system is sized perfectly for your home."

  - name: "Heating"
    slug: "heating"
    questions:
      - question: "Do I really need heating in a warm climate?"
        answer: "Yes — while winters in our region are mild compared to the rest of the country, temperatures regularly dip into the 40s and 50s during winter months, and cold snaps can bring freezing conditions. A reliable heating system keeps your family comfortable during those chilly mornings and evenings. Most homes in our area use a heat pump, which doubles as an efficient heating and cooling system, so you likely already have heating capability built into your AC."
      - question: "What type of heating system is best for our climate?"
        answer: "For most homes in our area, a heat pump is the best option because it provides both cooling and heating in a single system. Heat pumps are highly energy-efficient in our mild winters, using far less energy than traditional furnaces. For homes with gas hookups, a dual-fuel system that pairs a heat pump with a gas furnace offers the best of both worlds — electric efficiency most of the time and gas backup during rare extreme cold snaps."
      - question: "How often should my heating system be serviced?"
        answer: "Even in a mild climate, your heating system should be serviced at least once a year, ideally in the fall before you'll need it. Since most homes in our area use heat pumps that also serve as the AC, your twice-yearly maintenance covers both functions. Regular service ensures the system heats efficiently when you need it, and our maintenance program members get this taken care of automatically."
      - question: "Why is my heater blowing cold air?"
        answer: "A heater blowing cold air can be caused by an incorrect thermostat setting (make sure it's set to 'heat' and not 'cool' or 'fan only'), a dirty air filter restricting airflow, a tripped circuit breaker, a malfunctioning reversing valve on a heat pump, or low refrigerant levels. If checking the thermostat and filter doesn't solve the problem, contact Your Company Name — our experienced technicians can quickly diagnose and fix the issue."

  - name: "Indoor Air Quality & Insulation"
    slug: "indoor-air-quality"
    questions:
      - question: "Why is indoor air quality important in our climate?"
        answer: "Our region's hot, humid climate creates ideal conditions for mold, mildew, dust mites, and allergens to thrive indoors. Because we keep our homes sealed and air-conditioned most of the year, pollutants can build up to levels two to five times higher than outdoor air. Poor indoor air quality can aggravate allergies, asthma, and other respiratory conditions. Your Company Name offers solutions like whole-home air purifiers, UV germicidal lights, dehumidifiers, and professional duct cleaning to help your family breathe easier."
      - question: "Should I get a whole-home dehumidifier?"
        answer: "In our region, a whole-home dehumidifier is one of the best investments you can make for comfort and home protection. Our high humidity can overwhelm your AC system's ability to remove moisture, leaving your home feeling clammy even when the temperature is comfortable. Excess humidity also promotes mold growth, wood damage, and dust mite proliferation. A whole-home dehumidifier works alongside your HVAC system to maintain ideal humidity levels between 30-50%, improving comfort and protecting your home."
      - question: "How does attic insulation affect my HVAC efficiency?"
        answer: "In our region, your attic can reach temperatures of 150 degrees or more in summer. Without proper insulation, that extreme heat radiates down into your living space, forcing your AC to work much harder and driving up energy bills. Adequate attic insulation acts as a thermal barrier, keeping conditioned air inside where it belongs. Many homes in our area, especially older ones, are under-insulated. Upgrading your attic insulation can reduce cooling costs by up to 20% and significantly improve indoor comfort."
      - question: "Are smart thermostats worth the investment?"
        answer: "Absolutely. A smart thermostat can save homeowners in our area 10-15% on annual cooling and heating costs by learning your schedule, automatically adjusting temperatures when you're away, and optimizing run times for efficiency. They also provide useful diagnostics, remote access from your phone, and usage reports that help you understand your energy consumption. Your Company Name can recommend the best smart thermostat for your system and handle the installation to ensure everything is configured correctly."

