faqs:
  - question: "Do I need an appointment, or can I walk in?"
    answer: "We welcome walk-ins whenever a stylist is available, but booking ahead guarantees your preferred time and stylist."
  - question: "What is your cancellation policy?"
    answer: "We ask for at least 24 hours' notice to cancel or reschedule so we can offer the slot to another client."
  - question: "What products do you use?"
    answer: "We use professional-grade, cruelty-free color and styling lines selected for long-lasting results and hair health."
  - question: "How should I prepare for my first color appointment?"
    answer: "Come with dry, unwashed hair and a few reference photos so your colorist can plan the right approach for you."
  - question: "Do you offer gift cards?"
    answer: "Yes, gift cards are available in any amount, in-studio or through our contact form."

cta:
  heading: "Book Your Appointment"
  body: "Spots fill up quickly with our stylists — reserve your visit and let's find your next look."
  buttonText: "Book Now"
  buttonUrl: "/contact/"
