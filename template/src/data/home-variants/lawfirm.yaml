faqs:
  - question: "How much does a free consultation cost?"
    answer: "Nothing. Your initial consultation is completely free, with no obligation to hire us."
  - question: "What does 'no fee unless we win' mean?"
    answer: "For personal injury cases, you pay nothing upfront and no attorney fees unless we recover compensation on your behalf."
  - question: "How long will my case take?"
    answer: "Every case is different, but most personal injury claims resolve in 6-18 months depending on complexity."
  - question: "Do I need a lawyer for my divorce?"
    answer: "While not required, having an experienced family law attorney protects your rights and helps avoid costly mistakes."
  - question: "What areas of law do you practice?"
    answer: "We focus on personal injury, family law, and estate planning, giving each case dedicated attention."

