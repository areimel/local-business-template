testimonial:
  name: "Angela R."
  location: "Summit Auto Care Customer"
  rating: 5
  text: "Summit Auto Care is the only shop I trust. They explained exactly what my car needed, gave me a fair price, and had me back on the road the same day."

faqs:
  - question: "Is the estimate really free?"
    answer: "Yes — every estimate is free with no obligation to move forward with the repair."
  - question: "What does your warranty cover?"
    answer: "All repairs are backed by our 24-month warranty on parts and labor for your peace of mind."
  - question: "Do you offer loaner cars?"
    answer: "We offer loaner vehicles for major repairs — just ask when you schedule your appointment."
  - question: "How long will my repair take?"
    answer: "Most routine repairs are completed same-day. We'll always give you a clear timeline upfront."
  - question: "Do you work on all makes and models?"
    answer: "Yes, our ASE-certified technicians service both domestic and foreign vehicles of all makes and models."

cta:
  heading: "Get Your Free Estimate"
  body: "No pressure, no upsells — just honest advice and a fair price. Get your free estimate today."
  buttonText: "Get Your Free Estimate"
  buttonUrl: "/contact/"
  variant: "primary"
