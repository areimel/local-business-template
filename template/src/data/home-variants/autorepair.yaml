meta:
  title: "Summit Auto Care | Full-Service Auto Repair"
  description: "Honest, reliable auto repair from brakes to engine diagnostics. Get a free estimate today from Summit Auto Care."

hero:
  eyebrow: "Full-Service Auto Repair"
  heading: "Honest Repairs,"
  headingAccent: "Straight Talk"
  subheading: "Summit Auto Care has kept local drivers on the road for over 20 years — no upsells, no surprises, just honest work at a fair price."
  primaryCta:
    text: "Get an Estimate"
    url: "/contact/"
  secondaryCta:
    text: "About Our Shop"
    url: "/autorepair-about/"
  trustPills:
    - icon: "material-symbols:verified-user-outline"
      label: "ASE-Certified Technicians"
    - icon: "material-symbols:request-quote-outline"
      label: "Free, No-Obligation Estimates"
    - icon: "material-symbols:shield-outline"
      label: "24-Month Warranty on Repairs"

featuresHeading: "Full-Service Auto Repair"
features:
  - icon: "mdi:car-brake-alert"
    title: "Brakes"
    description: "Pad replacement, rotor resurfacing, and full brake system inspections."
  - icon: "mdi:engine-outline"
    title: "Engine Diagnostics"
    description: "Computerized diagnostics to pinpoint check-engine lights and performance issues."
  - icon: "mdi:oil"
    title: "Oil & Maintenance"
    description: "Oil changes, fluid checks, and scheduled maintenance to keep you running smoothly."
  - icon: "mdi:tire"
    title: "Tires & Alignment"
    description: "Tire rotations, replacements, and precision alignments for a smoother ride."

stepsHeading: "How It Works"
steps:
  - step: 1
    title: "Drop Off Your Vehicle"
    description: "Bring your car in or schedule a convenient drop-off time that works for you."
  - step: 2
    title: "Diagnose & Approve"
    description: "We inspect your vehicle and walk you through the findings before any work begins."
  - step: 3
    title: "Repair & Warranty"
    description: "We complete the repair and back it with our 24-month warranty for peace of mind."

