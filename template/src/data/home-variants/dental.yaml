  eyebrow: "Family & Cosmetic Dentistry"
  heading: "A Smile You'll Love,"
  headingAccent: "Care You Can Trust"
  subheading: "Brightside Dental offers gentle, modern dentistry for every member of your family — from routine cleanings to complete smile makeovers."
  primaryCta:
    text: "Book an Appointment"
    url: "/contact/"
  secondaryCta:
    text: "Book an Appointment"
    url: "/dental-booking/"
  trustPills:
    - icon: "material-symbols:verified-outline"
