featuresHeading: "Complete Care for Every Smile"
features:
  - icon: "mdi:tooth-outline"
    title: "General Dentistry"
    description: "Cleanings, exams, and fillings to keep your whole family's smile healthy."
  - icon: "material-symbols:star-outline"
    title: "Cosmetic Dentistry"
    description: "Whitening, veneers, and smile makeovers to help you feel confident."
  - icon: "material-symbols:straighten-outline"
    title: "Orthodontics"
    description: "Traditional braces and clear aligners for a straighter, healthier smile."
  - icon: "material-symbols:emergency-outline"
    title: "Emergency Dental Care"
    description: "Same-day appointments for toothaches, breaks, and dental emergencies."

stepsHeading: "Your First Visit"
steps:
  - step: 1
    title: "Book Online or By Phone"
    description: "Schedule your visit in minutes — new patients are always welcome."
  - step: 2
    title: "Meet Your Care Team"
    description: "We'll review your history and get to know your smile goals."
  - step: 3
    title: "Comprehensive Exam"
    description: "A gentle exam and digital X-rays give us the full picture of your oral health."
  - step: 4
    title: "Your Personalized Plan"
    description: "We'll walk you through a treatment plan built around your needs and budget."

