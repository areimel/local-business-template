faqs:
  - question: "Do you accept my dental insurance?"
    answer: "We work with over 30 insurance plans and will verify your benefits before your visit."
  - question: "Will my treatment hurt?"
    answer: "We use modern techniques and gentle anesthesia options to keep you comfortable throughout every procedure."
  - question: "Do you see children?"
    answer: "Yes! We welcome patients of all ages, from a child's first visit to adult and senior care."
  - question: "What if I have a dental emergency?"
    answer: "Call us right away — we reserve same-day slots for toothaches, breaks, and other urgent dental needs."
  - question: "How often should I get a checkup?"
    answer: "We recommend a cleaning and exam every six months to keep your smile healthy year-round."

cta:
  heading: "Book Your Visit Today"
  body: "New patients are always welcome. Schedule your appointment and see why families trust Brightside Dental."
  buttonText: "Book Your Visit Today"
  buttonUrl: "/contact/"
