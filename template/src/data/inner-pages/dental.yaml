meta:
  title: "Brightside Dental | Book Your Appointment"
  description: "Schedule your dental appointment online in just a few clicks. New patients welcome at Brightside Dental — gentle, modern care for the whole family."

hero:
  heading: "Book Your Visit"
  subheading: "New patients welcome. Schedule quickly and start your journey to a healthier, more confident smile."
  badge: "Book a Visit"

stepsHeading: "How to Book"

steps:
  - step: 1
    title: "Choose Your Service"
    description: "Select the reason for your visit — exam, cleaning, cosmetic, or emergency care."
  - step: 2
    title: "Pick Your Time"
    description: "Find an appointment that fits your schedule. We offer early morning and evening slots for busy families."
  - step: 3
    title: "Complete Your Profile"
    description: "Tell us a bit about yourself and your dental history so we're ready when you arrive."
  - step: 4
    title: "Confirm & Relax"
    description: "Get a confirmation email and arrive 10 minutes early. Our team handles the rest."

