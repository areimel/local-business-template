faqsHeading: "Menu & Dining FAQs"
faqs:
  - question: "Do you take reservations?"
    answer: "Yes — we recommend reserving a table, especially for weekend dinner service. You can book online or call us directly, and we'll do our best to accommodate walk-ins as space allows."
  - question: "Can you accommodate dietary restrictions or allergies?"
    answer: "Absolutely. Many of our pasta dishes can be made gluten-free, and our kitchen is happy to adjust for common allergens. Just let your server know when you order and we'll walk you through the best options."
  - question: "Do you host private events or large parties?"
    answer: "Yes — our private dining room seats up to 40 guests and is a popular spot for rehearsal dinners, birthdays, and corporate gatherings. Reach out and we'll build a custom menu for your event."
  - question: "Is there a corkage fee if we bring our own wine?"
    answer: "We charge a $25 corkage fee per bottle for outside wine. Our sommelier is also happy to help you pair something from our own 60+ bottle list instead."
  - question: "Do prices and menu items change seasonally?"
    answer: "Our core menu stays consistent, but we rotate seasonal specials based on what's freshest from our local growers. Ask your server about the evening's specials when you arrive."

