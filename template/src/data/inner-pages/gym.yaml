    title: "Recovery Lounge"
    description: "Stretch zones, foam rollers, and massage guns available to every member, every visit."

faqsHeading: "Membership FAQs"
faqs:
  - question: "Are your memberships month-to-month, or do I have to sign a contract?"
    answer: "All of our memberships are month-to-month with no long-term contract required. You can upgrade, downgrade, or cancel at any time with 30 days' notice."
  - question: "Can I freeze or pause my membership?"
    answer: "Yes — members can freeze their membership for up to 3 months per year, whether for travel, injury, or anything else. Just submit a freeze request at the front desk or through your member account."
  - question: "Do I get guest passes?"
    answer: "Premium and Elite members receive guest passes each month to bring a friend or family member. Basic members can purchase single-day guest passes at the front desk."
  - question: "How do I cancel my membership?"
    answer: "Cancellations require 30 days' written notice, submitted at the front desk or by email. There are no cancellation fees on any of our month-to-month plans."
  - question: "Is there a joining fee?"
    answer: "There is a one-time $49 enrollment fee for new members, which is waived during promotional periods. Ask us about current offers when you start your free trial."

cta:
  heading: "Start Your 7-Day Free Trial"
  body: "No contract, no pressure — come see the facility, try a class, and train on us for a full week."
  buttonText: "Start Free Trial"
  buttonUrl: "/contact/"
  variant: "primary"
