featuresHeading: "What's Included"
features:
  - icon: "material-symbols:fitness-center"
    title: "Full Training Floor Access"
    description: "20,000 sq ft of free weights, machines, turf, and sled area — open to every membership tier."
  - icon: "material-symbols:sports-gymnastics"
    title: "60+ Weekly Group Classes"
    description: "HIIT, strength, cycle, and yoga classes included at no extra cost on Premium and Elite plans."
  - icon: "material-symbols:schedule-outline"
    title: "24/7 Key-Fob Access"
    description: "Train on your schedule, day or night, with secure key-fob entry any time of day."
  - icon: "material-symbols:shower-outline"
    title: "Locker Rooms & Showers"
    description: "Full locker rooms with showers, towel service, and secure day-use lockers."
  - icon: "material-symbols:groups-outline"
    title: "Certified Personal Trainers"
    description: "One-on-one sessions with trainers certified in strength, mobility, and sport-specific programming."
