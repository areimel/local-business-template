meta:
  title: "Our Story | Summit Auto Care"
  description: "Learn about Summit Auto Care — 20+ years of honest, ASE-certified auto repair. Family owned, no upsells, just straight talk and fair prices."

hero:
  heading: "About Summit Auto Care"
  subheading: "Honest repairs and straight talk, from a shop that's been part of this community for over 20 years."
  badge: "About Us"

story:
  badge: "Our Story"
  heading: "Built on Honest Work and Fair Prices"
  paragraphs:
    - "Summit Auto Care opened its doors in 2004 with a simple promise: tell customers the truth about their vehicle, and charge a fair price for fixing it. That promise hasn't changed in over 20 years."
    - "What started as a two-bay garage with a single ASE-certified technician has grown into a full-service shop trusted by thousands of local drivers — but the values are exactly the same as they were on day one."
    - "Today our team of ASE-certified mechanics handles everything from routine oil changes to complex engine diagnostics, always walking customers through what's wrong and what it will cost before any work begins."

