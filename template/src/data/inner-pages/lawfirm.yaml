faqs:
  - question: "How much does a consultation with an attorney cost?"
    answer: "Nothing. Every initial consultation with our attorneys is free, with no obligation to hire the firm afterward."
  - question: "Will I work directly with a partner, or get passed to a paralegal?"
    answer: "Every case is overseen by one of our attorneys from intake through resolution. Paralegals support the case, but a lawyer is always the one making the strategic calls."
  - question: "Do I pay anything upfront for a personal injury case?"
    answer: "No. Personal injury cases are handled on contingency — you pay no attorney fees unless we recover compensation for you."
  - question: "Is what I tell my attorney confidential?"
    answer: "Yes. Everything you share with any attorney or staff member at our firm is protected by attorney-client privilege."
  - question: "What should I bring to my first meeting?"
    answer: "Bring any documents related to your case — accident reports, medical records, correspondence, or court paperwork — along with a list of questions. We'll tell you what else is needed after we hear the details."

