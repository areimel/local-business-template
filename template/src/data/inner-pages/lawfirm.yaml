      icon: "mdi:gavel"
    - name: "Renee Ortiz, Esq."
      role: "Associate Attorney"
      bio: "Renee supports the firm's personal injury and family law caseload, ensuring no client's questions go unanswered and no deadline is missed."
      icon: "material-symbols:person"
    - name: "Thomas Reyes"
      role: "Senior Paralegal & Client Liaison"
      bio: "Thomas is often the first and most frequent point of contact for clients, coordinating case updates, records requests, and scheduling across the firm."
