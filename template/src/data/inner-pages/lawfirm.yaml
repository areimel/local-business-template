    - name: "Margaret Hartwell, Esq."
      role: "Managing Partner, Personal Injury"
      bio: "Founded the firm in 1998 after a decade at a top regional litigation practice. Margaret has personally recovered more than $30 million for injured clients and tries cases when insurers refuse to negotiate fairly."
      icon: "material-symbols:person-pin-outline"
    - name: "David Chen, Esq."
      role: "Family Law Partner"
      bio: "David guides clients through divorce, custody, and support disputes with a calm, strategic approach. He is a certified family law mediator and believes most families are better served by resolution than by a drawn-out fight."
